[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activity = "1.13.0"
composeMultiplatform = "1.12.1"
kotlin = "2.4.20"
material3 = "1.12.0-alpha03"
junit = "4.13.2"
coroutines = "1.10.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
compose-icons = { module = "org.jetbrains.compose.material:material-icons-extended", version = "1.7.3" }
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version = "1.52.0" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-biometric = { module = "androidx.biometric:biometric", version = "1.1.0" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version = "1.4.2" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version = "1.4.2" }
camera-view = { module = "androidx.camera:camera-view", version = "1.4.2" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version = "1.1.1" }
mlkit-text = { module = "com.google.mlkit:text-recognition", version = "16.0.1" }
# F10: X25519 (minSdk 26 no lo trae). HKDF, AES-GCM y SHA-256 salen de javax.crypto.
tink-android = { module = "com.google.crypto.tink:tink-android", version = "1.17.0" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
